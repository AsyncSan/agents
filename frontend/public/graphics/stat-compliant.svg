<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGlow3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.03"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0f"/>
  <rect width="1200" height="630" fill="url(#bgGlow3)"/>

  <!-- EU stars ring (simplified) -->
  <g transform="translate(950, 200)" opacity="0.15">
    <circle cx="0" cy="-70" r="6" fill="#f59e0b"/>
    <circle cx="35" cy="-60" r="6" fill="#f59e0b"/>
    <circle cx="60" cy="-35" r="6" fill="#f59e0b"/>
    <circle cx="70" cy="0" r="6" fill="#f59e0b"/>
    <circle cx="60" cy="35" r="6" fill="#f59e0b"/>
    <circle cx="35" cy="60" r="6" fill="#f59e0b"/>
    <circle cx="0" cy="70" r="6" fill="#f59e0b"/>
    <circle cx="-35" cy="60" r="6" fill="#f59e0b"/>
    <circle cx="-60" cy="35" r="6" fill="#f59e0b"/>
    <circle cx="-70" cy="0" r="6" fill="#f59e0b"/>
    <circle cx="-60" cy="-35" r="6" fill="#f59e0b"/>
    <circle cx="-35" cy="-60" r="6" fill="#f59e0b"/>
  </g>

  <!-- Big number -->
  <text x="100" y="260" font-family="monospace" font-size="170" font-weight="bold" fill="#f59e0b">&lt;30%</text>

  <!-- Label -->
  <text x="100" y="310" font-family="monospace" font-size="28" font-weight="bold" fill="#f1f5f9">Compliant</text>

  <!-- Subtitle -->
  <text x="100" y="380" font-family="monospace" font-size="22" fill="#f1f5f9">of EU SMEs have taken steps toward</text>
  <text x="100" y="415" font-family="monospace" font-size="22" fill="#f59e0b">AI Act compliance</text>

  <!-- Countdown box -->
  <rect x="100" y="460" width="440" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" opacity="0.8"/>

  <!-- Countdown icon (clock) -->
  <circle cx="140" cy="495" r="18" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
  <line x1="140" y1="485" x2="140" y2="495" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
  <line x1="140" y1="495" x2="150" y2="500" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>

  <!-- Countdown text -->
  <text x="175" y="490" font-family="monospace" font-size="28" font-weight="bold" fill="#f59e0b">108 days</text>
  <text x="175" y="515" font-family="monospace" font-size="14" fill="#64748b">until August 2, 2026 deadline</text>

  <!-- Source -->
  <text x="100" y="580" font-family="monospace" font-size="14" fill="#64748b">Source: EU AI Act Readiness Survey 2026</text>

  <!-- Branding -->
  <text x="1100" y="580" font-family="monospace" font-size="14" fill="#64748b" text-anchor="end">agents.renemurrell.de</text>
</svg>