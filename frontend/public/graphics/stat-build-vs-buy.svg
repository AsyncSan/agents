<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGlow4" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.02"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0f"/>
  <rect width="1200" height="630" fill="url(#bgGlow4)"/>

  <!-- Title -->
  <text x="600" y="80" font-family="monospace" font-size="36" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Build vs Buy</text>
  <text x="600" y="115" font-family="monospace" font-size="18" fill="#64748b" text-anchor="middle">Agent infrastructure. First year.</text>

  <!-- Divider line -->
  <line x1="600" y1="150" x2="600" y2="520" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- VS circle -->
  <circle cx="600" cy="310" r="28" fill="#0a0a0f" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="317" font-family="monospace" font-size="16" font-weight="bold" fill="#64748b" text-anchor="middle">vs</text>

  <!-- BUILD column -->
  <rect x="80" y="150" width="460" height="370" rx="12" fill="#1e293b" opacity="0.3" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>

  <text x="310" y="200" font-family="monospace" font-size="20" fill="#f59e0b" text-anchor="middle" font-weight="bold">BUILD IN-HOUSE</text>

  <text x="310" y="310" font-family="monospace" font-size="100" font-weight="bold" fill="#f59e0b" text-anchor="middle">$300K+</text>

  <!-- Build breakdown -->
  <text x="130" y="390" font-family="monospace" font-size="15" fill="#64748b">Engineering team (3-5 devs)</text>
  <text x="490" y="390" font-family="monospace" font-size="15" fill="#f59e0b" text-anchor="end">$250K+</text>

  <line x1="130" y1="400" x2="490" y2="400" stroke="#1e293b" stroke-width="1"/>

  <text x="130" y="425" font-family="monospace" font-size="15" fill="#64748b">Infrastructure &amp; tooling</text>
  <text x="490" y="425" font-family="monospace" font-size="15" fill="#f59e0b" text-anchor="end">$30K+</text>

  <line x1="130" y1="435" x2="490" y2="435" stroke="#1e293b" stroke-width="1"/>

  <text x="130" y="460" font-family="monospace" font-size="15" fill="#64748b">Security &amp; compliance</text>
  <text x="490" y="460" font-family="monospace" font-size="15" fill="#f59e0b" text-anchor="end">$20K+</text>

  <line x1="130" y1="470" x2="490" y2="470" stroke="#1e293b" stroke-width="1"/>

  <text x="130" y="495" font-family="monospace" font-size="15" fill="#64748b">Time to production</text>
  <text x="490" y="495" font-family="monospace" font-size="15" fill="#f59e0b" text-anchor="end">6-12 mo</text>

  <!-- BUY column -->
  <rect x="660" y="150" width="460" height="370" rx="12" fill="#1e293b" opacity="0.3" stroke="#10b981" stroke-width="1" opacity="0.3"/>

  <text x="890" y="200" font-family="monospace" font-size="20" fill="#10b981" text-anchor="middle" font-weight="bold">MANAGED PLATFORM</text>

  <text x="890" y="310" font-family="monospace" font-size="100" font-weight="bold" fill="#10b981" text-anchor="middle">$6K/yr</text>

  <!-- Buy breakdown -->
  <text x="710" y="390" font-family="monospace" font-size="15" fill="#64748b">Platform subscription</text>
  <text x="1070" y="390" font-family="monospace" font-size="15" fill="#10b981" text-anchor="end">$500/mo</text>

  <line x1="710" y1="400" x2="1070" y2="400" stroke="#1e293b" stroke-width="1"/>

  <text x="710" y="425" font-family="monospace" font-size="15" fill="#64748b">Security included</text>
  <text x="1070" y="425" font-family="monospace" font-size="15" fill="#10b981" text-anchor="end">$0</text>

  <line x1="710" y1="435" x2="1070" y2="435" stroke="#1e293b" stroke-width="1"/>

  <text x="710" y="460" font-family="monospace" font-size="15" fill="#64748b">Compliance built-in</text>
  <text x="1070" y="460" font-family="monospace" font-size="15" fill="#10b981" text-anchor="end">$0</text>

  <line x1="710" y1="470" x2="1070" y2="470" stroke="#1e293b" stroke-width="1"/>

  <text x="710" y="495" font-family="monospace" font-size="15" fill="#64748b">Time to production</text>
  <text x="1070" y="495" font-family="monospace" font-size="15" fill="#10b981" text-anchor="end">1-2 weeks</text>

  <!-- Savings callout -->
  <rect x="400" y="545" width="400" height="45" rx="8" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="600" y="575" font-family="monospace" font-size="18" font-weight="bold" fill="#10b981" text-anchor="middle">50x cost reduction</text>

  <!-- Branding -->
  <text x="1100" y="610" font-family="monospace" font-size="14" fill="#64748b" text-anchor="end">agents.renemurrell.de</text>
</svg>