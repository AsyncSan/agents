<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1100" width="680" height="1100">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="680" height="1100" fill="#0a0a0f"/>
  <rect x="0" y="0" width="680" height="1100" fill="url(#glow)" opacity="0.5"/>

  <!-- Title -->
  <text x="340" y="48" text-anchor="middle" fill="#f1f5f9" font-family="monospace" font-size="20" font-weight="bold">6-Phase Dispatch Pipeline</text>
  <text x="340" y="70" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="12" opacity="0.7">agents.renemurrell.de</text>

  <!-- Timeline line -->
  <line x1="120" y1="100" x2="120" y2="1040" stroke="#00d4ff" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Phase 1: Task Submit -->
  <circle cx="120" cy="120" r="6" fill="#00d4ff"/>
  <circle cx="120" cy="120" r="10" fill="none" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="145" y="116" fill="#f1f5f9" font-family="monospace" font-size="14" font-weight="bold">Task Submit</text>
  <text x="145" y="134" fill="#f1f5f9" font-family="monospace" font-size="11" opacity="0.6">Consumer submits task via API</text>
  <rect x="460" y="106" rx="4" ry="4" width="80" height="24" fill="#00d4ff" fill-opacity="0.1" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="500" y="123" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="11">t = 0s</text>

  <!-- Arrow down -->
  <line x1="120" y1="150" x2="120" y2="200" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Phase 2: Pending + Worker Pickup -->
  <circle cx="120" cy="220" r="6" fill="#00d4ff"/>
  <circle cx="120" cy="220" r="10" fill="none" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="145" y="216" fill="#f1f5f9" font-family="monospace" font-size="14" font-weight="bold">Pending / Worker Pickup</text>
  <text x="145" y="234" fill="#f1f5f9" font-family="monospace" font-size="11" opacity="0.6">Worker polls queue, claims task</text>
  <rect x="460" y="206" rx="4" ry="4" width="100" height="24" fill="#00d4ff" fill-opacity="0.1" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="510" y="223" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="11">5s poll</text>

  <!-- Arrow down -->
  <line x1="120" y1="250" x2="120" y2="300" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Phase 3: Server Boot -->
  <circle cx="120" cy="330" r="6" fill="#00d4ff"/>
  <circle cx="120" cy="330" r="10" fill="none" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="140" y="305" rx="6" ry="6" width="400" height="70" fill="#00d4ff" fill-opacity="0.05" stroke="#00d4ff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="155" y="326" fill="#f1f5f9" font-family="monospace" font-size="14" font-weight="bold">Server Boot</text>
  <text x="155" y="346" fill="#f1f5f9" font-family="monospace" font-size="11" opacity="0.6">Hetzner ARM64 (cax11) Nuremberg</text>
  <text x="155" y="364" fill="#f1f5f9" font-family="monospace" font-size="11" opacity="0.6">Ephemeral, snapshot-based provisioning</text>
  <rect x="460" y="316" rx="4" ry="4" width="100" height="24" fill="#00d4ff" fill-opacity="0.1" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="510" y="333" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="11">~90s</text>

  <!-- Arrow down -->
  <line x1="120" y1="390" x2="120" y2="430" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Phase 4: SSH Ready -->
  <circle cx="120" cy="450" r="6" fill="#00d4ff"/>
  <circle cx="120" cy="450" r="10" fill="none" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="145" y="446" fill="#f1f5f9" font-family="monospace" font-size="14" font-weight="bold">SSH Ready</text>
  <text x="145" y="464" fill="#f1f5f9" font-family="monospace" font-size="11" opacity="0.6">Connection established, workspace init</text>
  <rect x="460" y="436" rx="4" ry="4" width="100" height="24" fill="#00d4ff" fill-opacity="0.1" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="510" y="453" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="11">~30s</text>

  <!-- Arrow down -->
  <line x1="120" y1="480" x2="120" y2="520" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Phase 5: Secret Injection -->
  <circle cx="120" cy="550" r="6" fill="#ff6b6b"/>
  <circle cx="120" cy="550" r="10" fill="none" stroke="#ff6b6b" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="140" y="525" rx="6" ry="6" width="400" height="70" fill="#ff6b6b" fill-opacity="0.04" stroke="#ff6b6b" stroke-opacity="0.2" stroke-width="1"/>
  <text x="155" y="546" fill="#f1f5f9" font-family="monospace" font-size="14" font-weight="bold">Secret Injection</text>
  <text x="155" y="566" fill="#f1f5f9" font-family="monospace" font-size="11" opacity="0.6">3-path isolation: consumer / provider / platform</text>
  <text x="155" y="584" fill="#f1f5f9" font-family="monospace" font-size="11" opacity="0.6">Secrets never touch disk before this step</text>
  <rect x="460" y="536" rx="4" ry="4" width="100" height="24" fill="#ff6b6b" fill-opacity="0.1" stroke="#ff6b6b" stroke-opacity="0.3" stroke-width="1"/>
  <text x="510" y="553" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="11">~2s</text>

  <!-- Arrow down -->
  <line x1="120" y1="610" x2="120" y2="650" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Phase 6: Agent Execution -->
  <circle cx="120" cy="680" r="6" fill="#00ff88"/>
  <circle cx="120" cy="680" r="10" fill="none" stroke="#00ff88" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="140" y="650" rx="6" ry="6" width="400" height="80" fill="#00ff88" fill-opacity="0.04" stroke="#00ff88" stroke-opacity="0.2" stroke-width="1"/>
  <text x="155" y="674" fill="#f1f5f9" font-family="monospace" font-size="14" font-weight="bold">Agent Execution</text>
  <text x="155" y="694" fill="#00ff88" font-family="monospace" font-size="12">$ openclaw run --task &lt;id&gt;</text>
  <text x="155" y="714" fill="#f1f5f9" font-family="monospace" font-size="11" opacity="0.6">Sandboxed runtime, stdout/stderr captured</text>
  <rect x="460" y="666" rx="4" ry="4" width="100" height="24" fill="#00ff88" fill-opacity="0.1" stroke="#00ff88" stroke-opacity="0.3" stroke-width="1"/>
  <text x="510" y="683" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="11">variable</text>

  <!-- Arrow down -->
  <line x1="120" y1="745" x2="120" y2="780" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Phase 7: Result Collection -->
  <circle cx="120" cy="800" r="6" fill="#00d4ff"/>
  <circle cx="120" cy="800" r="10" fill="none" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="145" y="796" fill="#f1f5f9" font-family="monospace" font-size="14" font-weight="bold">Result Collection</text>
  <text x="145" y="814" fill="#f1f5f9" font-family="monospace" font-size="11" opacity="0.6">Artifacts, logs, exit code persisted to DB</text>
  <rect x="460" y="786" rx="4" ry="4" width="100" height="24" fill="#00d4ff" fill-opacity="0.1" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="510" y="803" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="11">~5s</text>

  <!-- Arrow down -->
  <line x1="120" y1="830" x2="120" y2="870" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Phase 8: Server Destroy -->
  <circle cx="120" cy="900" r="6" fill="#ff6b6b"/>
  <circle cx="120" cy="900" r="10" fill="none" stroke="#ff6b6b" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="140" y="878" rx="6" ry="6" width="400" height="50" fill="#ff6b6b" fill-opacity="0.04" stroke="#ff6b6b" stroke-opacity="0.2" stroke-width="1"/>
  <text x="155" y="900" fill="#f1f5f9" font-family="monospace" font-size="14" font-weight="bold">Server Destroy</text>
  <text x="155" y="918" fill="#f1f5f9" font-family="monospace" font-size="11" opacity="0.6">Full deletion. Secrets, data, logs gone.</text>
  <rect x="460" y="888" rx="4" ry="4" width="100" height="24" fill="#ff6b6b" fill-opacity="0.1" stroke="#ff6b6b" stroke-opacity="0.3" stroke-width="1"/>
  <text x="510" y="905" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="11">~10s</text>

  <!-- Arrow down -->
  <line x1="120" y1="942" x2="120" y2="970" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Phase 9: Trust Update -->
  <circle cx="120" cy="990" r="6" fill="#00d4ff"/>
  <circle cx="120" cy="990" r="10" fill="none" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="145" y="986" fill="#f1f5f9" font-family="monospace" font-size="14" font-weight="bold">Trust Update</text>
  <text x="145" y="1004" fill="#f1f5f9" font-family="monospace" font-size="11" opacity="0.6">Provider trust score recalculated</text>
  <rect x="460" y="976" rx="4" ry="4" width="100" height="24" fill="#00d4ff" fill-opacity="0.1" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="510" y="993" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="11">async</text>

  <!-- Total time bar -->
  <rect x="60" y="1050" rx="4" ry="4" width="560" height="30" fill="#00d4ff" fill-opacity="0.06" stroke="#00d4ff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="340" y="1070" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="12">Total overhead: ~140s  |  Zero residual state</text>
</svg>