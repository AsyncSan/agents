<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 700" width="780" height="700">
  <defs>
    <linearGradient id="glow2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="780" height="700" fill="#0a0a0f"/>
  <rect x="0" y="0" width="780" height="700" fill="url(#glow2)" opacity="0.5"/>

  <!-- Title -->
  <text x="390" y="42" text-anchor="middle" fill="#f1f5f9" font-family="monospace" font-size="20" font-weight="bold">3-Path Secret Brokerage</text>
  <text x="390" y="64" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="12" opacity="0.7">Scoped isolation. Never shared. Destroyed with server.</text>

  <!-- Source layer label -->
  <text x="390" y="108" text-anchor="middle" fill="#f1f5f9" font-family="monospace" font-size="13" opacity="0.4">SOURCE LAYER</text>

  <!-- Path 1: Consumer Keys -->
  <rect x="40" y="125" rx="8" ry="8" width="220" height="100" fill="#00d4ff" fill-opacity="0.06" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="70" cy="155" r="12" fill="none" stroke="#00d4ff" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="70" y="159" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="12">C</text>
  <text x="92" y="155" fill="#f1f5f9" font-family="monospace" font-size="14" font-weight="bold">Consumer Keys</text>
  <text x="60" y="178" fill="#f1f5f9" font-family="monospace" font-size="10" opacity="0.5">API keys from task requester</text>
  <text x="60" y="194" fill="#f1f5f9" font-family="monospace" font-size="10" opacity="0.5">e.g. OPENAI_API_KEY, DB creds</text>
  <text x="60" y="210" fill="#00d4ff" font-family="monospace" font-size="10" opacity="0.7">scope: consumer_id only</text>

  <!-- Path 2: Provider Keys -->
  <rect x="280" y="125" rx="8" ry="8" width="220" height="100" fill="#ff6b6b" fill-opacity="0.06" stroke="#ff6b6b" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="310" cy="155" r="12" fill="none" stroke="#ff6b6b" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="310" y="159" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="12">P</text>
  <text x="332" y="155" fill="#f1f5f9" font-family="monospace" font-size="14" font-weight="bold">Provider Keys</text>
  <text x="300" y="178" fill="#f1f5f9" font-family="monospace" font-size="10" opacity="0.5">Agent provider credentials</text>
  <text x="300" y="194" fill="#f1f5f9" font-family="monospace" font-size="10" opacity="0.5">e.g. GH token, deploy keys</text>
  <text x="300" y="210" fill="#ff6b6b" font-family="monospace" font-size="10" opacity="0.7">scope: provider_id only</text>

  <!-- Path 3: Platform Keys -->
  <rect x="520" y="125" rx="8" ry="8" width="220" height="100" fill="#00ff88" fill-opacity="0.06" stroke="#00ff88" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="550" cy="155" r="12" fill="none" stroke="#00ff88" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="550" y="159" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="12">S</text>
  <text x="572" y="155" fill="#f1f5f9" font-family="monospace" font-size="14" font-weight="bold">Platform Keys</text>
  <text x="540" y="178" fill="#f1f5f9" font-family="monospace" font-size="10" opacity="0.5">System-level credentials</text>
  <text x="540" y="194" fill="#f1f5f9" font-family="monospace" font-size="10" opacity="0.5">e.g. Hetzner API, monitoring</text>
  <text x="540" y="210" fill="#00ff88" font-family="monospace" font-size="10" opacity="0.7">scope: platform only</text>

  <!-- Isolation indicator -->
  <rect x="40" y="245" rx="4" ry="4" width="700" height="28" fill="#ff6b6b" fill-opacity="0.04" stroke="#ff6b6b" stroke-opacity="0.15" stroke-width="1"/>
  <text x="390" y="264" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="11" opacity="0.8">ISOLATION BOUNDARY -- scopes never overlap, no cross-path access</text>

  <!-- Arrows down -->
  <line x1="150" y1="273" x2="150" y2="340" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="390" y1="273" x2="390" y2="340" stroke="#ff6b6b" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="630" y1="273" x2="630" y2="340" stroke="#00ff88" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Arrow heads -->
  <path d="M145,338 L150,348 L155,338" fill="none" stroke="#00d4ff" stroke-opacity="0.5" stroke-width="1"/>
  <path d="M385,338 L390,348 L395,338" fill="none" stroke="#ff6b6b" stroke-opacity="0.5" stroke-width="1"/>
  <path d="M625,338 L630,348 L635,338" fill="none" stroke="#00ff88" stroke-opacity="0.5" stroke-width="1"/>

  <!-- Ephemeral Server box -->
  <rect x="40" y="350" rx="10" ry="10" width="700" height="230" fill="#f1f5f9" fill-opacity="0.02" stroke="#f1f5f9" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="390" y="380" text-anchor="middle" fill="#f1f5f9" font-family="monospace" font-size="14" font-weight="bold">Ephemeral Server (Hetzner ARM64)</text>
  <text x="390" y="398" text-anchor="middle" fill="#f1f5f9" font-family="monospace" font-size="11" opacity="0.4">Exists only during task execution</text>

  <!-- /workspace/secrets/consumer/ -->
  <rect x="70" y="420" rx="6" ry="6" width="190" height="70" fill="#00d4ff" fill-opacity="0.08" stroke="#00d4ff" stroke-opacity="0.25" stroke-width="1"/>
  <text x="165" y="445" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="10">/workspace/secrets/</text>
  <text x="165" y="462" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="12" font-weight="bold">consumer/</text>
  <text x="165" y="480" text-anchor="middle" fill="#f1f5f9" font-family="monospace" font-size="9" opacity="0.5">*.env, *.json</text>

  <!-- /workspace/secrets/provider/ -->
  <rect x="295" y="420" rx="6" ry="6" width="190" height="70" fill="#ff6b6b" fill-opacity="0.08" stroke="#ff6b6b" stroke-opacity="0.25" stroke-width="1"/>
  <text x="390" y="445" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="10">/workspace/secrets/</text>
  <text x="390" y="462" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="12" font-weight="bold">provider/</text>
  <text x="390" y="480" text-anchor="middle" fill="#f1f5f9" font-family="monospace" font-size="9" opacity="0.5">*.env, *.json</text>

  <!-- /workspace/secrets/api-keys.env -->
  <rect x="520" y="420" rx="6" ry="6" width="190" height="70" fill="#00ff88" fill-opacity="0.08" stroke="#00ff88" stroke-opacity="0.25" stroke-width="1"/>
  <text x="615" y="445" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="10">/workspace/secrets/</text>
  <text x="615" y="462" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="12" font-weight="bold">api-keys.env</text>
  <text x="615" y="480" text-anchor="middle" fill="#f1f5f9" font-family="monospace" font-size="9" opacity="0.5">merged platform keys</text>

  <!-- Merged runtime env -->
  <rect x="150" y="510" rx="6" ry="6" width="480" height="50" fill="#f1f5f9" fill-opacity="0.03" stroke="#f1f5f9" stroke-opacity="0.1" stroke-width="1"/>
  <text x="390" y="535" text-anchor="middle" fill="#f1f5f9" font-family="monospace" font-size="11" opacity="0.6">Agent runtime reads scoped env. No cross-path visibility.</text>
  <text x="390" y="550" text-anchor="middle" fill="#f1f5f9" font-family="monospace" font-size="11" opacity="0.4">Process-level isolation via separate env namespaces</text>

  <!-- Destruction -->
  <rect x="40" y="610" rx="8" ry="8" width="700" height="60" fill="#ff6b6b" fill-opacity="0.04" stroke="#ff6b6b" stroke-opacity="0.2" stroke-width="1"/>
  <text x="72" y="637" fill="#ff6b6b" font-family="monospace" font-size="22" opacity="0.6">&#x2717;</text>
  <text x="100" y="637" fill="#f1f5f9" font-family="monospace" font-size="14" font-weight="bold">Server Destroyed</text>
  <text x="100" y="656" fill="#f1f5f9" font-family="monospace" font-size="11" opacity="0.5">All 3 secret paths deleted. No residual state. No disk forensics possible.</text>
</svg>